[package]
name = "burpsy-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
burpsy-core = { path = "../core" }
burpsy-bcheck = { path = "../bcheck" }
burpsy-scanner = { path = "../scanner" }
tokio = { workspace = true }
bytes = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
parking_lot = { workspace = true }
rcgen = { version = "0.14.8", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
rustls = { version = "0.23.42", default-features = false, features = ["std", "aws-lc-rs", "tls12", "logging"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["aws-lc-rs", "tls12", "logging"] }
rustls-pemfile = "2.2.0"
rustls-pki-types = "1.15.1"
time = "0.3"

[dev-dependencies]
# Integration tests and the `intercept_e2e` example drive the real HTTP API, which lives in the web
# crate. Cargo permits a dev-dependency cycle precisely for this: `burpsy-web` depends on this crate
# for real, and this crate depends on it only to test itself.
burpsy-web = { path = "../web" }
axum = "0.8"
serde_json = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
burpsy-core = { path = "../core" }
tracing-subscriber = { workspace = true }
