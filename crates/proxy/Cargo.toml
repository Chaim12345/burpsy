[package]
name = "burpsy-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
burpsy-core = { path = "../core" }
burpsy-bcheck = { path = "../bcheck" }
burpsy-scanner = { path = "../scanner" }
tokio = { workspace = true }
bytes = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
parking_lot = { workspace = true }
# Intercept conditions. Pinned per-crate the way `bcheck` and `scanner` pin it rather than promoted
# to the workspace — and both of those are already dependencies here, so this compiles nothing new.
regex = "1"
rcgen = { version = "0.14.8", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
rustls = { version = "0.23.42", default-features = false, features = ["std", "aws-lc-rs", "tls12", "logging"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["aws-lc-rs", "tls12", "logging"] }
rustls-pemfile = "2.2.0"
rustls-pki-types = "1.15.1"
time = "0.3"
# HTTP/2 relay (H2-01/H2-04). `h2` drives both legs of an intercepted, ALPN-negotiated h2
# connection; `http` is the typed request/response vocabulary it speaks. The scope check and TLS
# handshake have already happened upstream of this crate's MITM path before `h2` sees a stream.
h2 = "0.4"
http = "1"

[dev-dependencies]
# Integration tests and the `intercept_e2e` example drive the real HTTP API, which lives in the web
# crate. Cargo permits a dev-dependency cycle precisely for this: `burpsy-web` depends on this crate
# for real, and this crate depends on it only to test itself.
burpsy-web = { path = "../web" }
axum = "0.8"
serde_json = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
burpsy-core = { path = "../core" }
# The example drives the blocking transport directly to measure connection pooling, which is a
# transport concern rather than an authorisation one.
burpsy-sender = { path = "../sender" }
# `env-filter` explicitly, not inherited. The example calls `with_env_filter`, and until now that
# only compiled because `burpsy-cli` enables the feature and cargo unified it across the workspace —
# so `cargo test -p burpsy-proxy` alone failed to build. Depend on what you use.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The ALPN test drives a real TLS origin and a real TLS client through the proxy, because ALPN is
# negotiated by the handshake and no unit test can observe what a target actually selected. Same
# versions and features as the dependencies above, so cargo reuses one compiled copy of each.
rustls = { version = "0.23.42", default-features = false, features = ["std", "aws-lc-rs", "tls12", "logging"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["aws-lc-rs", "tls12", "logging"] }
rustls-pki-types = "1.15.1"
# The h2 relay test drives a real h2 origin and a real h2 client through the proxy, because
# ALPN + stream forwarding cannot be observed from a unit test. Same version as the main dep.
h2 = "0.4"
