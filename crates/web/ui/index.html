<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>burpsy</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h1>burpsy</h1>
      <nav role="tablist" aria-label="Main Navigation">
        <button role="tab" aria-selected="true" class="on" data-t="dashboard">Dashboard</button>
        <button role="tab" aria-selected="false" data-t="history">History</button>
        <button role="tab" aria-selected="false" data-t="wshistory">WS History</button>
        <button role="tab" aria-selected="false" data-t="sitemap">Site map</button>
        <button role="tab" aria-selected="false" data-t="repeater">Repeater</button>
        <button role="tab" aria-selected="false" data-t="intruder">Intruder</button>
        <button role="tab" aria-selected="false" data-t="intercept">Intercept</button>
        <button role="tab" aria-selected="false" data-t="scanner">Scanner</button>
        <button role="tab" aria-selected="false" data-t="decoder">Decoder</button>
        <button role="tab" aria-selected="false" data-t="comparer">Comparer</button>
        <button role="tab" aria-selected="false" data-t="logger">Logger</button>
        <button role="tab" aria-selected="false" data-t="organizer">Organizer</button>
        <button role="tab" aria-selected="false" data-t="matchreplace">Match/Replace</button>
        <button role="tab" aria-selected="false" data-t="session">Session</button>
        <button role="tab" aria-selected="false" data-t="sequencer">Sequencer</button>
      </nav>
      <a id="ca-link" href="/ca.crt" download style="display: none">CA cert</a>
      <span id="scope-badge" class="badge" title=""></span>
      <div id="stats"></div>
    </header>
    <main>
      <section id="dashboard" class="on"></section>
      <section id="history"></section>
      <section id="wshistory"></section>
      <section id="sitemap"></section>
      <section id="repeater"></section>
      <section id="intruder"></section>
      <section id="intercept"></section>
      <section id="scanner"></section>
      <section id="decoder"></section>
      <section id="comparer"></section>
      <section id="logger"></section>
      <section id="organizer"></section>
      <section id="matchreplace"></section>
      <section id="session"></section>
      <section id="sequencer"></section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
