name: Go

# The gate for burpsy-go, which is the active implementation. Until this file existed the Go tree
# had no CI at all: release.yml builds only the Rust CLI, so every Go guarantee in the repo rested
# on someone running the suite by hand and reporting the result honestly.
#
# The four commands here are the same four AGENTS.md names as the gate, in the same order, each its
# own step so a failure says which one broke rather than "the job failed".

# Pushes run only on master. Every other branch is covered by its pull request, so a push to a PR
# branch no longer runs the gate twice for the same commit.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it supersedes. The suite takes tens of
# minutes; finishing a run for a commit nobody will merge only delays the one that matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: burpsy-go

jobs:
  gate:
    runs-on: ubuntu-latest
    # The scanner package alone runs ~200-480s: it drives a real headless Chrome over the DOM rows
    # and a deferred render pass over the stored-DOM ones. 45 minutes is headroom for a cold cache
    # on a slower runner, not an expectation.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # go.mod is the single source of the version, so bumping it here is not a second place to
      # forget.
      - uses: actions/setup-go@v5
        with:
          go-version-file: burpsy-go/go.mod
          cache-dependency-path: burpsy-go/go.sum

      # Chrome is a real dependency of the DOM catalog rows, not an optional extra. The suite has a
      # BURPSY_ALLOW_NO_CHROME escape hatch for a deliberately reduced environment, and this job
      # deliberately does NOT set it: a CI run that quietly demonstrated 35 fewer rows than the pin
      # claims is precisely the "we did not look" reported as "we looked and found nothing" that
      # this project forbids. ubuntu-latest ships Chrome; if that ever stops being true this step
      # fails loudly here rather than silently reducing coverage 20 minutes later.
      - name: Verify Chrome is present
        run: |
          for name in chromium google-chrome google-chrome-stable chrome; do
            if command -v "$name" >/dev/null 2>&1; then
              echo "found $name: $($name --version 2>&1 | head -1)"
              exit 0
            fi
          done
          echo "::error::No Chrome/Chromium on PATH. The DOM catalog rows cannot be exercised, so"
          echo "::error::this run would report far fewer demonstrated rows than the suite pins."
          exit 1

      # xmllint (libxml2-utils) validates the Burp-XML report export against
      # the DTD embedded in internal/report/burpxml.go. The Go-side tests skip
      # with a reason naming the missing binary when it is absent — the same
      # convention the tlsx/interactsh rows follow — and installing it here is
      # what keeps CI from exercising that skip: a gate that quietly skipped
      # DTD validation would be reporting "the export validates" over a test
      # that never ran (burpsy-react-ui-m7dk).
      - name: Install xmllint for the Burp-XML DTD validation tests
        run: |
          if ! command -v xmllint >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
          fi
          xmllint --version

      # tlsx and interactsh-client are NOT installed here, so the rows that shell out to them stay
      # undemonstrated and their tests skip with a reason naming the missing binary. That is the
      # honest outcome rather than a hidden one: those rows are already counted as registered-only
      # in docs/SCANNER-COVERAGE.md, so CI is not claiming something the local gate does not.
      #
      # ffuf and nuclei ARE installed, because internal/extscan's capability gate is the Chrome
      # rule again: its live tests fail the package when a binary was missing, and a runner without
      # them reported red on every push since the subprocess phases landed while verifying nothing
      # about the integration. Pinned versions rather than @latest — a CI gate that moves under its
      # own feet is not a gate. The template corpus is fetched with the binary it belongs to; the
      # test checks ~/.local/nuclei-templates/http directly, since a binary with no templates runs
      # and matches nothing, which would let an empty result pass for a real scan.
      #
      # Both tools come from their published release binaries, not `go install`. Compiling them
      # with this module's toolchain broke the gate: nuclei v3.3.9 pulls an old bytedance/sonic that
      # go:linknames encoding/json internals, and Go 1.26 refuses that at link time
      # ("invalid reference to encoding/json.unquoteBytes"), so every run since the toolchain bump
      # died here before a single test ran. A prebuilt binary carries the toolchain it was built
      # with, so the tools stop depending on ours. The SHA-256 values are pinned here, not read
      # from the release's own checksums file: that file only proves the download is intact, while
      # a hash in this workflow also proves the release is the one that was reviewed. nuclei is
      # v3.8.0, the version the extscan live tests are developed against locally.
      - name: Install ffuf, nuclei and interactsh-client (live tests)
        working-directory: ${{ runner.temp }}
        env:
          FFUF_VERSION: 2.1.0
          FFUF_SHA256: fc2c82736c14dcbea4daf3d3cf3878c1c4773008ba45c2bc0fceba7d17b40bb5
          NUCLEI_VERSION: 3.8.0
          NUCLEI_SHA256: cd4ea43c88b50af8ab96eb6ad3fb4debd8e9d51efaff4d4c2d99106041578943
          INTERACTSH_VERSION: 1.3.1
          INTERACTSH_SHA256: d553fb3dd4c2684c953aedeb555f13f0d1ca94bd75112c949a5fd975d385a903
        run: |
          set -euo pipefail
          bin="$HOME/.local/bin"
          mkdir -p "$bin"
          curl -fsSL -o ffuf.tar.gz \
            "https://github.com/ffuf/ffuf/releases/download/v${FFUF_VERSION}/ffuf_${FFUF_VERSION}_linux_amd64.tar.gz"
          echo "${FFUF_SHA256}  ffuf.tar.gz" | sha256sum -c -
          tar -xzf ffuf.tar.gz -C "$bin" ffuf
          curl -fsSL -o nuclei.zip \
            "https://github.com/projectdiscovery/nuclei/releases/download/v${NUCLEI_VERSION}/nuclei_${NUCLEI_VERSION}_linux_amd64.zip"
          echo "${NUCLEI_SHA256}  nuclei.zip" | sha256sum -c -
          unzip -o -q nuclei.zip nuclei -d "$bin"
          # interactsh-client: internal/web's batch-mint test registers against the real public
          # interactsh pool through this binary (api_collaborator_batch_test.go). Without it the
          # test fails the web package. v1.3.1 is the version the test was written against.
          curl -fsSL -o interactsh.zip \
            "https://github.com/projectdiscovery/interactsh/releases/download/v${INTERACTSH_VERSION}/interactsh-client_${INTERACTSH_VERSION}_linux_amd64.zip"
          echo "${INTERACTSH_SHA256}  interactsh.zip" | sha256sum -c -
          unzip -o -q interactsh.zip interactsh-client -d "$bin"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/ffuf" -V
          "$bin/nuclei" -version
          "$bin/interactsh-client" -version
      # The corpus is a pinned release archive, not `nuclei -update-templates`. On a fresh runner
      # the updater printed "nuclei-templates are not installed, installing..." and exited within a
      # second having installed nothing and said nothing (an unauthenticated GitHub API call from a
      # shared runner IP is the likely cause). The archive comes from codeload, which that limit
      # does not apply to, and the corpus no longer moves between runs. burpsy runs nuclei with -duc
      # and explicit -t paths (internal/extscan/nuclei.go), so nuclei's own updater is never needed.
      # v10.4.8 is the corpus the live tests run against locally.
      - name: Fetch nuclei template corpus
        working-directory: ${{ runner.temp }}
        env:
          TEMPLATES_VERSION: 10.4.8
          TEMPLATES_SHA256: 53ae80d9bcfff638fbff62c4b730c436564b6bf5e05cf4f86a7eefe37c7ecc47
        run: |
          set -euo pipefail
          dir="$HOME/.local/nuclei-templates"
          mkdir -p "$dir"
          curl -fsSL -o templates.tar.gz \
            "https://github.com/projectdiscovery/nuclei-templates/archive/refs/tags/v${TEMPLATES_VERSION}.tar.gz"
          echo "${TEMPLATES_SHA256}  templates.tar.gz" | sha256sum -c -
          tar -xzf templates.tar.gz -C "$dir" --strip-components=1
          test -d "$HOME/.local/nuclei-templates/http" || {
            echo "::error::nuclei template corpus did not land in ~/.local/nuclei-templates"
            exit 1
          }

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # -count=1 defeats the test cache. Without it a cached pass would print the same coverage
      # claim without having re-verified anything, which the suite's own cached-replay guard now
      # reports but which has no place in CI at all.
      - name: go test
        run: go test ./... -count=1 -timeout 1700s
