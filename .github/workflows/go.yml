name: Go

# The gate for burpsy-go, which is the active implementation. Until this file existed the Go tree
# had no CI at all: release.yml builds only the Rust CLI, so every Go guarantee in the repo rested
# on someone running the suite by hand and reporting the result honestly.
#
# The four commands here are the same four AGENTS.md names as the gate, in the same order, each its
# own step so a failure says which one broke rather than "the job failed".

on:
  push:
    branches: [master, ui-react-comparison]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: burpsy-go

jobs:
  gate:
    runs-on: ubuntu-latest
    # The scanner package alone runs ~200-480s: it drives a real headless Chrome over the DOM rows
    # and a deferred render pass over the stored-DOM ones. 45 minutes is headroom for a cold cache
    # on a slower runner, not an expectation.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # go.mod is the single source of the version, so bumping it here is not a second place to
      # forget.
      - uses: actions/setup-go@v5
        with:
          go-version-file: burpsy-go/go.mod
          cache-dependency-path: burpsy-go/go.sum

      # Chrome is a real dependency of the DOM catalog rows, not an optional extra. The suite has a
      # BURPSY_ALLOW_NO_CHROME escape hatch for a deliberately reduced environment, and this job
      # deliberately does NOT set it: a CI run that quietly demonstrated 35 fewer rows than the pin
      # claims is precisely the "we did not look" reported as "we looked and found nothing" that
      # this project forbids. ubuntu-latest ships Chrome; if that ever stops being true this step
      # fails loudly here rather than silently reducing coverage 20 minutes later.
      - name: Verify Chrome is present
        run: |
          for name in chromium google-chrome google-chrome-stable chrome; do
            if command -v "$name" >/dev/null 2>&1; then
              echo "found $name: $($name --version 2>&1 | head -1)"
              exit 0
            fi
          done
          echo "::error::No Chrome/Chromium on PATH. The DOM catalog rows cannot be exercised, so"
          echo "::error::this run would report far fewer demonstrated rows than the suite pins."
          exit 1

      # tlsx and interactsh-client are NOT installed here, so the rows that shell out to them stay
      # undemonstrated and their tests skip with a reason naming the missing binary. That is the
      # honest outcome rather than a hidden one: those rows are already counted as registered-only
      # in docs/SCANNER-COVERAGE.md, so CI is not claiming something the local gate does not.
      #
      # ffuf and nuclei ARE installed, because internal/extscan's capability gate is the Chrome
      # rule again: its live tests fail the package when a binary was missing, and a runner without
      # them reported red on every push since the subprocess phases landed while verifying nothing
      # about the integration. Pinned versions rather than @latest — a CI gate that moves under its
      # own feet is not a gate. The template corpus is fetched with the binary it belongs to; the
      # test checks ~/.local/nuclei-templates/http directly, since a binary with no templates runs
      # and matches nothing, which would let an empty result pass for a real scan.
      #
      # WHAT BROKE (burpsy-react-ui-d4iu), so the next person does not re-derive it: this step used
      # to be two `go install pkg@version` lines, and nuclei's failed at LINK time after 4m17s of
      # compiling — before gofmt/build/vet/test ever ran, so every push was red while verifying
      # nothing about the code:
      #
      #     # github.com/projectdiscovery/nuclei/v3/cmd/nuclei
      #     link: github.com/bytedance/sonic/ast: invalid reference to encoding/json.unquoteBytes
      #
      # nuclei v3.3.9 pulls github.com/bytedance/sonic v1.12.8, and sonic reaches into the
      # standard library with
      # `//go:linkname unquoteBytes encoding/json.unquoteBytes` (ast/stubs.go:141). That
      # linkname is not a symbol a newer toolchain exports to linkname callers, so the reference
      # is undefined at link. Reproduced locally on go1.26 and go1.27 — it is not a runner-only
      # quirk, and it is not caused by the toolchain this job selects.
      #
      # THE FIX, in two parts, because either alone is not enough:
      #   1. Build from a temporary module instead of `go install pkg@version`, so the dependency
      #      graph is resolved once into a go.mod this step can then override.
      #   2. `go get github.com/bytedance/sonic@v1.15.4` in that module. sonic dropped the bad
      #      linkname after v1.13.2; v1.14.2 and every later release build clean. Without this
      #      bump the same link error reproduces from the temp module too — verified, not assumed.
      #
      # `|| { ... exit 1; }` on each build is deliberate: a bare failure here is an unexplained
      # red X, and the whole point of this bead is that the gate must say what it verified rather
      # than only that it did not. The `go get` of the override is allowed to fail loudly under
      # `set -e` for the same reason.
      - name: Install ffuf and nuclei (extscan live tests)
        run: |
          set -euo pipefail
          tools_dir="$(mktemp -d)"
          cd "$tools_dir"
          go mod init burpsy-tools >/dev/null
          # ffuf has no problematic transitive tree; it is built the pinned-module way anyway so
          # that both tools fail the same way and neither is a special case to remember.
          go get github.com/ffuf/ffuf/v2@v2.1.0
          go get github.com/projectdiscovery/nuclei/v3/cmd/nuclei@v3.3.9
          # The load-bearing override. See the comment above for why v1.12.8 cannot be linked.
          go get github.com/bytedance/sonic@v1.15.4
          go build -o "$HOME/go/bin/ffuf" github.com/ffuf/ffuf/v2 \
            || { echo "::error::building pinned ffuf failed"; exit 1; }
          go build -o "$HOME/go/bin/nuclei" github.com/projectdiscovery/nuclei/v3/cmd/nuclei \
            || { echo "::error::building pinned nuclei failed (see the link/compile error above)"; exit 1; }
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      # The guard checks BOTH locations nuclei has used, and reports what it found.
      #
      # It used to check only ~/.local/nuclei-templates/http while `nuclei
      # -update-templates` under the pinned v3.3.9 installs to ~/nuclei-templates — so this
      # step failed on a runner where the update had just succeeded. That is the SECOND
      # half of burpsy-react-ui-d4iu: once the install was fixed the job still went red,
      # one step further along, for a path that was simply wrong. The Go-side test had the
      # same wrong assumption and was fixed with it.
      #
      # `|| true` on the update is kept: it is a network call to projectdiscovery.io, and
      # a transient failure there should be reported by the guard below naming the
      # directories it actually checked, not by a bare curl error.
      - name: Fetch nuclei template corpus
        run: |
          nuclei -update-templates >/dev/null 2>&1 || true
          for dir in "$HOME/.local/nuclei-templates/http" "$HOME/nuclei-templates/http"; do
            if [ -d "$dir" ]; then
              echo "nuclei corpus present at $dir ($(find "$dir" -name '*.yaml' | wc -l) templates)"
              exit 0
            fi
          done
          echo "::error::nuclei template corpus did not land in any location nuclei uses:"
          echo "::error::  $HOME/.local/nuclei-templates/http"
          echo "::error::  $HOME/nuclei-templates/http"
          echo "::error::without a corpus nuclei runs and matches nothing, so the live test would pass for an empty scan"
          exit 1

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # -count=1 defeats the test cache. Without it a cached pass would print the same coverage
      # claim without having re-verified anything, which the suite's own cached-replay guard now
      # reports but which has no place in CI at all.
      - name: go test
        run: go test ./... -count=1 -timeout 1700s
