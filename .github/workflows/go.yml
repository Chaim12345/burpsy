name: Go

# The gate for burpsy-go, which is the active implementation. Until this file existed the Go tree
# had no CI at all: release.yml builds only the Rust CLI, so every Go guarantee in the repo rested
# on someone running the suite by hand and reporting the result honestly.
#
# The four commands here are the same four AGENTS.md names as the gate, in the same order, each its
# own step so a failure says which one broke rather than "the job failed".

# Pushes run only on master. Every other branch is covered by its pull request, so a push to a PR
# branch no longer runs the gate twice for the same commit.
#
# Pull requests run only when they target master. Under docs/DEVELOPMENT-PROCESS.md item PRs target
# a round branch (round/<date>-<n>) and are covered by the T1/T2 tiers; this workflow is T3, the
# full gate run once per round on the exact tree that lands. That is deliberate, not an oversight:
# an item PR into a round branch shows no checks.
#
# The review gate lives in its own workflow (review-gate.yml): it must re-run when a verdict is
# posted as a comment or review, and it runs under pull_request_target with the default branch's
# rules; neither fits this workflow.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR cancels the run it supersedes: the suite takes tens of minutes, and
# finishing a run for a commit nobody will merge only delays the one that matters.
#
# A push to master is never cancelled. Each one is a commit that landed, and its run is the only
# evidence that master passes at that commit; with cancel-in-progress on master, 15 of 19 master
# runs on 2026-10-09 were cancelled by the next merge and master was green at almost no commit
# anyone could name. A master push therefore gets a group of its own commit: GitHub keeps only one
# PENDING run per group and silently drops the rest, so a shared master group would still lose the
# middle commits of a burst even with cancellation off. Per-commit groups run each of them.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: burpsy-go

jobs:
  gate:
    runs-on: ubuntu-latest
    # The scanner package alone runs ~200-480s: it drives a real headless Chrome over the DOM rows
    # and a deferred render pass over the stored-DOM ones. The limit is headroom for a cold cache
    # on a slower runner, not an expectation. The internal/web race step below adds ~4-6 minutes,
    # which is why this is 55 rather than the 45 it was before that step existed.
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4

      # go.mod is the single source of the version, so bumping it here is not a second place to
      # forget.
      - uses: actions/setup-go@v5
        with:
          go-version-file: burpsy-go/go.mod
          cache-dependency-path: burpsy-go/go.sum

      # Chrome is a real dependency of the DOM catalog rows, not an optional extra. The suite has a
      # BURPSY_ALLOW_NO_CHROME escape hatch for a deliberately reduced environment, and this job
      # deliberately does NOT set it: a CI run that quietly demonstrated 35 fewer rows than the pin
      # claims is precisely the "we did not look" reported as "we looked and found nothing" that
      # this project forbids. ubuntu-latest ships Chrome; if that ever stops being true this step
      # fails loudly here rather than silently reducing coverage 20 minutes later.
      - name: Verify Chrome is present
        run: |
          for name in chromium google-chrome google-chrome-stable chrome; do
            if command -v "$name" >/dev/null 2>&1; then
              echo "found $name: $($name --version 2>&1 | head -1)"
              exit 0
            fi
          done
          echo "::error::No Chrome/Chromium on PATH. The DOM catalog rows cannot be exercised, so"
          echo "::error::this run would report far fewer demonstrated rows than the suite pins."
          exit 1

      # xmllint (libxml2-utils) validates the Burp-XML report export against
      # the DTD embedded in internal/report/burpxml.go. The Go-side tests skip
      # with a reason naming the missing binary when it is absent — the same
      # convention the tlsx/interactsh rows follow — and installing it here is
      # what keeps CI from exercising that skip: a gate that quietly skipped
      # DTD validation would be reporting "the export validates" over a test
      # that never ran (burpsy-react-ui-m7dk).
      - name: Install xmllint for the Burp-XML DTD validation tests
        run: |
          if ! command -v xmllint >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
          fi
          xmllint --version

      # The four pinned archives below are downloaded once and then restored from the Actions
      # cache rather than fetched from GitHub releases on every run. Only the DOWNLOAD is cached:
      # every run still checks each archive against the SHA-256 pinned in this file (a cached
      # file that fails it is fetched again, and the check runs on whatever was fetched), and
      # still extracts and installs it exactly as before. The key is this file's hash, so bumping
      # any version or hash here starts a fresh cache rather than reusing an archive for the old
      # pin. A miss costs nothing but the download the step always used to make.
      - name: Restore the pinned tool and template archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/burpsy-ci-downloads
          key: burpsy-ci-downloads-${{ runner.os }}-${{ hashFiles('.github/workflows/go.yml') }}

      # tlsx is NOT installed here (interactsh-client is, below), so the rows that shell out to it stay
      # undemonstrated and their tests skip with a reason naming the missing binary. That is the
      # honest outcome rather than a hidden one: those rows are already counted as registered-only
      # in docs/SCANNER-COVERAGE.md, so CI is not claiming something the local gate does not.
      #
      # ffuf and nuclei ARE installed, because internal/extscan's capability gate is the Chrome
      # rule again: its live tests fail the package when a binary was missing, and a runner without
      # them reported red on every push since the subprocess phases landed while verifying nothing
      # about the integration. Pinned versions rather than @latest — a CI gate that moves under its
      # own feet is not a gate. The template corpus is fetched with the binary it belongs to; the
      # test checks ~/.local/nuclei-templates/http directly, since a binary with no templates runs
      # and matches nothing, which would let an empty result pass for a real scan.
      #
      # Both tools come from their published release binaries, not `go install`. Compiling them
      # with this module's toolchain broke the gate: nuclei v3.3.9 pulls an old bytedance/sonic that
      # go:linknames encoding/json internals, and Go 1.26 refuses that at link time
      # ("invalid reference to encoding/json.unquoteBytes"), so every run since the toolchain bump
      # died here before a single test ran. A prebuilt binary carries the toolchain it was built
      # with, so the tools stop depending on ours. The SHA-256 values are pinned here, not read
      # from the release's own checksums file: that file only proves the download is intact, while
      # a hash in this workflow also proves the release is the one that was reviewed. nuclei is
      # v3.8.0, the version the extscan live tests are developed against locally.
      - name: Install ffuf, nuclei and interactsh-client (live tests)
        working-directory: ${{ runner.temp }}
        env:
          FFUF_VERSION: 2.1.0
          FFUF_SHA256: fc2c82736c14dcbea4daf3d3cf3878c1c4773008ba45c2bc0fceba7d17b40bb5
          NUCLEI_VERSION: 3.8.0
          NUCLEI_SHA256: cd4ea43c88b50af8ab96eb6ad3fb4debd8e9d51efaff4d4c2d99106041578943
          INTERACTSH_VERSION: 1.3.1
          INTERACTSH_SHA256: d553fb3dd4c2684c953aedeb555f13f0d1ca94bd75112c949a5fd975d385a903
        run: |
          set -euo pipefail
          bin="$HOME/.local/bin"
          mkdir -p "$bin"
          # fetch FILE SHA256 URL: reuse a cached archive only if it already matches its pin.
          fetch() {
            if [ -f "$1" ] && echo "$2  $1" | sha256sum -c --status -; then
              echo "using the cached $1"
            else
              curl -fsSL -o "$1" "$3"
            fi
          }
          dl="$HOME/.cache/burpsy-ci-downloads"
          mkdir -p "$dl"
          cd "$dl"
          fetch ffuf.tar.gz "${FFUF_SHA256}" \
            "https://github.com/ffuf/ffuf/releases/download/v${FFUF_VERSION}/ffuf_${FFUF_VERSION}_linux_amd64.tar.gz"
          echo "${FFUF_SHA256}  ffuf.tar.gz" | sha256sum -c -
          tar -xzf ffuf.tar.gz -C "$bin" ffuf
          fetch nuclei.zip "${NUCLEI_SHA256}" \
            "https://github.com/projectdiscovery/nuclei/releases/download/v${NUCLEI_VERSION}/nuclei_${NUCLEI_VERSION}_linux_amd64.zip"
          echo "${NUCLEI_SHA256}  nuclei.zip" | sha256sum -c -
          unzip -o -q nuclei.zip nuclei -d "$bin"
          # interactsh-client: internal/web's batch-mint test registers against the real public
          # interactsh pool through this binary (api_collaborator_batch_test.go). Without it the
          # test fails the web package. v1.3.1 is the version the test was written against.
          fetch interactsh.zip "${INTERACTSH_SHA256}" \
            "https://github.com/projectdiscovery/interactsh/releases/download/v${INTERACTSH_VERSION}/interactsh-client_${INTERACTSH_VERSION}_linux_amd64.zip"
          echo "${INTERACTSH_SHA256}  interactsh.zip" | sha256sum -c -
          unzip -o -q interactsh.zip interactsh-client -d "$bin"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/ffuf" -V
          "$bin/nuclei" -version
          "$bin/interactsh-client" -version
      # The corpus is a pinned release archive, not `nuclei -update-templates`. On a fresh runner
      # the updater printed "nuclei-templates are not installed, installing..." and exited within a
      # second having installed nothing and said nothing (an unauthenticated GitHub API call from a
      # shared runner IP is the likely cause). The archive comes from codeload, which that limit
      # does not apply to, and the corpus no longer moves between runs. burpsy runs nuclei with -duc
      # and explicit -t paths (internal/extscan/nuclei.go), so nuclei's own updater is never needed.
      # v10.4.8 is the corpus the live tests run against locally.
      - name: Fetch nuclei template corpus
        working-directory: ${{ runner.temp }}
        env:
          TEMPLATES_VERSION: 10.4.8
          TEMPLATES_SHA256: 53ae80d9bcfff638fbff62c4b730c436564b6bf5e05cf4f86a7eefe37c7ecc47
        run: |
          set -euo pipefail
          dir="$HOME/.local/nuclei-templates"
          mkdir -p "$dir"
          # fetch FILE SHA256 URL: reuse a cached archive only if it already matches its pin.
          fetch() {
            if [ -f "$1" ] && echo "$2  $1" | sha256sum -c --status -; then
              echo "using the cached $1"
            else
              curl -fsSL -o "$1" "$3"
            fi
          }
          dl="$HOME/.cache/burpsy-ci-downloads"
          mkdir -p "$dl"
          cd "$dl"
          fetch templates.tar.gz "${TEMPLATES_SHA256}" \
            "https://github.com/projectdiscovery/nuclei-templates/archive/refs/tags/v${TEMPLATES_VERSION}.tar.gz"
          echo "${TEMPLATES_SHA256}  templates.tar.gz" | sha256sum -c -
          tar -xzf templates.tar.gz -C "$dir" --strip-components=1
          test -d "$HOME/.local/nuclei-templates/http" || {
            echo "::error::nuclei template corpus did not land in ~/.local/nuclei-templates"
            exit 1
          }

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # -count=1 defeats the test cache. Without it a cached pass would print the same coverage
      # claim without having re-verified anything, which the suite's own cached-replay guard now
      # reports but which has no place in CI at all.
      - name: go test
        run: go test ./... -count=1 -timeout 1700s

      # The race detector, scoped to the one package where request handlers share server state
      # across goroutines. Until burpsy-react-ui-h68z, `go test -race ./internal/web/` could not
      # pass: the lazily built active scanner was a plain field written by audit handlers and read
      # by a dozen others, and two run registries answered their 202 with a field the worker was
      # already rewriting. Nothing ran -race, so each of those shipped green. This step is what
      # keeps the package race-clean; it costs ~4 minutes on a 4-core machine.
      #
      # Not the whole module: internal/scanner alone takes ~8 minutes without -race and drives a
      # real Chrome, and the race detector typically slows code several-fold, so a full-module race
      # run would roughly double this job at best. Widen the step package by package, as each one
      # is shown race-clean, rather than all at once and red.
      - name: go test -race (internal/web)
        run: go test -race -count=1 -timeout 900s ./internal/web/

  # The React console: type check, the source guards, and bundle freshness. Until this job existed
  # none of it ran unless someone ran it by hand — tsc, the no-native-dialogs guard (which caught
  # three real breaks on 2026-10-09 alone) and check:gated-routes included. `bun run check` is the
  # package's own definition of those checks (package.json), so a guard added there is gated here
  # without editing this file.
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: burpsy-go/internal/web/ui

    steps:
      - uses: actions/checkout@v4

      # Pinned exactly: dist/app.js is byte-reproducible only with the same bun (two rebuilds with
      # 1.4.2 were identical; another version emits different bytes and the freshness step below
      # would fail every PR). scripts/dev-setup.sh warns a developer whose bun differs.
      # The action itself is pinned by commit, not tag: it downloads and runs the toolchain that
      # builds the shipped bundle, and a tag can be moved. 0c5077e5 is v2.2.0 (= v2 on 2026-10-09).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      # --frozen-lockfile: a PR that changes dependencies must change bun.lock with them, rather
      # than CI resolving something nobody reviewed.
      - name: bun install
        run: bun install --frozen-lockfile

      # tsc --noEmit, token checks, the gated-routes check, script tests and the src/lib tests (which
      # hold the no-native-dialogs guard). `bun run build` does NOT type-check; this step does.
      - name: bun run check
        run: bun run check

      - name: bun run build
        run: bun run build

      # "Shipped" means "in the embedded bundle": go:embed serves the committed dist/app.js, so a UI
      # source change that was never rebuilt reaches no browser while every test passes. Rebuilding
      # with the pinned bun and requiring no difference makes that state unmergeable. The whole UI
      # directory is compared, so generated token files are held to the same rule.
      - name: Bundle is fresh
        run: |
          if ! git diff --quiet -- .; then
            echo "::error::The committed UI bundle or generated files differ from a fresh 'bun run build' (bun 1.4.2):"
            git diff --stat --text -- .
            echo "::error::Rebuild in burpsy-go/internal/web/ui with bun 1.4.2 and commit the result (the lead does this once per round; see docs/DEVELOPMENT-PROCESS.md section 5)."
            exit 1
          fi
          untracked=$(git ls-files --others --exclude-standard -- .)
          if [ -n "$untracked" ]; then
            echo "::error::The build produced files that are not committed:"
            echo "$untracked"
            exit 1
          fi
          echo "dist/app.js, style.css and generated sources match a fresh build."

  # .beads/issues.jsonl on master is the issue tracker's source of truth. This job holds every
  # change to it to the closure rule: a bead closed by this change must cite the PR and the commit
  # that did the work, and that commit must be in the history being merged. Closures already on the
  # base are grandfathered. The rule and its exceptions are in scripts/beads-lint.py.
  beads:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .

    steps:
      # Full history: "is this sha in the history being merged" cannot be answered from a shallow
      # clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # HEAD^1 is the right base for both events. For a pull request the checkout is GitHub's
      # merge commit, whose first parent is the base branch it merges into; for a push to master
      # (always a merge commit under branch protection) it is the previous tip.
      - name: beads lint
        run: python3 -I scripts/beads-lint.py --base HEAD^1
