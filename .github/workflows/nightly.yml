name: Nightly

# What the per-merge gate (go.yml) does not run, run once a day against master's tip. A red run here
# is a defect on master to file and fix, not a reason to block a merge that its own checks passed.
#
# Not required by branch protection: a scheduled run is attached to no pull request.
#
#   e2e-go   e2e-go.sh against a local target.
#   race     every go.yml test shard except race-web-0/1, under -race (CI_SHARD_RACE=1). With
#            race-web on every push to master, the race detector covers the whole module.
#
# There is no separate plain (non-race) full-suite job: the push to master already runs the full
# suite on the commit this run tests, and the race run executes the same tests again (a superset,
# as in go.yml's reasoning for dropping the plain internal/web shard).

on:
  schedule:
    # 03:17 UTC. Off the hour on purpose: scheduled runs at :00 are the ones GitHub delays or drops
    # under load.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # e2e-go.sh builds the real binary and drives it end to end against a local Python target on
  # 127.0.0.1 (ports 18180/18181/18199): proxy capture, history, audit, repeater, intruder,
  # sequencer, the cookie jar, stats. It needs only go, python3 and curl, all on the runner. It
  # reaches no host but loopback.
  e2e-go:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # The shared Go setup (toolchain + module/build cache); the lint flavor is the closest build.
      - uses: ./.github/actions/burpsy-test-env
        with:
          cache-flavor: lint
          tools: "false"

      # NO_PROXY is cleared because curl applies it even to an explicit `-x` proxy: with 127.0.0.1
      # in NO_PROXY (as some environments set it) the suite's proxied request goes direct, nothing
      # is captured, and four history assertions fail for a reason that is not the product's.
      - name: e2e-go.sh
        run: env -u NO_PROXY -u no_proxy ./e2e-go.sh

      - name: burpsy log (on failure)
        if: failure()
        run: |
          tail -100 /tmp/burpsy-go.log || true
          cat /tmp/burpsy-go-e2e-build.log 2>/dev/null || true

  # The race detector beyond internal/web (which go.yml runs under -race on every push to master).
  # Until 2026-10-13 this was one job over the module minus three exclusions, and two of them
  # were "not yet shown race-clean": internal/scanner (~8 minutes WITHOUT -race, Chrome-driving) and
  # internal/extscan (needs the pinned ffuf/nuclei/interactsh install). Both now run here, through
  # the same shards and the same tool install as go.yml, so a race in them is found rather than
  # assumed absent. A red scanner shard is a race or a race-mode timeout to file, as before.
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: scanner-budget, flavor: race-scanner, save: true }
          - { shard: scanner-detect, flavor: race-scanner, save: false }
          - { shard: scanner-rest-0, flavor: race-scanner, save: false }
          - { shard: scanner-rest-1, flavor: race-scanner, save: false }
          - { shard: rest, flavor: race-rest, save: true }
    name: race (${{ matrix.shard }})
    env:
      CI_SHARD_RACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/burpsy-test-env
        id: env
        with:
          cache-flavor: ${{ matrix.flavor }}
          shard: ${{ matrix.shard }}
      - name: go test -race (${{ matrix.shard }})
        env:
          SHARD: ${{ matrix.shard }}
        run: scripts/ci-shard.sh "$SHARD"
      - name: Save the Go cache (${{ matrix.flavor }})
        if: always() && matrix.save && steps.env.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.env.outputs.cache-key }}
