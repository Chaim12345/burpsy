name: Nightly

# What the per-merge gate (go.yml) does not run, run once a day against master's tip. A red run here
# is a defect on master to file and fix, not a reason to block a merge that its own checks passed.
#
# Not required by branch protection: a scheduled run is attached to no pull request.
#
#   e2e-go   e2e-go.sh against a local target.
#   bench-vulnapp  the scored VulnerableApp benchmark against the tracked baseline (scripts/bench).
#   fuzz     every fuzz target for 2 minutes each, one process per target (scripts/ci-fuzz.sh).
#   race     every go.yml test shard except race-web-0/1 and race-core, under -race (CI_SHARD_RACE=1). With
#            race-web and race-core on every push to master, the race detector covers the whole module.
#   report   when any job above fails, opens (or comments on) one `nightly-failure` issue naming the
#            failed jobs and the commit, so a red night reaches someone instead of sitting in the tab.
#
# There is no separate plain (non-race) full-suite job: the push to master already runs the full
# suite on the commit this run tests, and the race run executes the same tests again (a superset,
# as in go.yml's reasoning for dropping the plain internal/web shard).

on:
  schedule:
    # 03:17 UTC. Off the hour on purpose: scheduled runs at :00 are the ones GitHub delays or drops
    # under load.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # e2e-go.sh builds the real binary and drives it end to end against a local Python target on
  # 127.0.0.1 (ports 18180/18181/18199): proxy capture, history, audit, repeater, intruder,
  # sequencer, the cookie jar, stats. It needs only go, python3 and curl, all on the runner. It
  # reaches no host but loopback.
  e2e-go:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # The shared Go setup (toolchain + module/build cache); the lint flavor is the closest build.
      - uses: ./.github/actions/burpsy-test-env
        with:
          cache-flavor: lint
          tools: "false"

      # NO_PROXY is cleared because curl applies it even to an explicit `-x` proxy: with 127.0.0.1
      # in NO_PROXY (as some environments set it) the suite's proxied request goes direct, nothing
      # is captured, and four history assertions fail for a reason that is not the product's.
      - name: e2e-go.sh
        run: env -u NO_PROXY -u no_proxy ./e2e-go.sh

      - name: burpsy log (on failure)
        if: failure()
        run: |
          tail -100 /tmp/burpsy-go.log || true
          cat /tmp/burpsy-go-e2e-build.log 2>/dev/null || true

  # The race detector beyond internal/web (which go.yml runs under -race on every push to master).
  # Until 2026-10-13 this was one job over the module minus three exclusions, and two of them
  # were "not yet shown race-clean": internal/scanner (~8 minutes WITHOUT -race, Chrome-driving) and
  # internal/extscan (needs the pinned ffuf/nuclei/interactsh install). Both now run here, through
  # the same shards and the same tool install as go.yml, so a race in them is found rather than
  # assumed absent. A red scanner shard is a race or a race-mode timeout to file, as before.
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: scanner-budget, flavor: race-scanner, save: true }
          - { shard: scanner-detect, flavor: race-scanner, save: false }
          - { shard: scanner-rest-0, flavor: race-scanner, save: false }
          - { shard: scanner-rest-1, flavor: race-scanner, save: false }
          - { shard: rest, flavor: race-rest, save: true }
    name: race (${{ matrix.shard }})
    env:
      CI_SHARD_RACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/burpsy-test-env
        id: env
        with:
          cache-flavor: ${{ matrix.flavor }}
          shard: ${{ matrix.shard }}
      - name: go test -race (${{ matrix.shard }})
        env:
          SHARD: ${{ matrix.shard }}
        run: scripts/ci-shard.sh "$SHARD"
      - name: Save the Go cache (${{ matrix.flavor }})
        if: always() && matrix.save && steps.env.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.env.outputs.cache-key }}

  # Scored benchmark (bead j1mk.38; the burpsy side of j1mk.1): burpsy's active scanner against OWASP
  # VulnerableApp, scored by scripts/bench/run_vulnapp.py, then compared with the tracked baseline
  # in scripts/bench/baseline/vulnapp.json. Regressions fail the job (a lower strict score beyond a
  # 1-point margin, fewer true positives for a type, more false positives for a type); an
  # improvement never does, and is printed so the baseline can be moved up in a reviewed commit.
  # With no baseline committed yet the job passes with a warning and uploads the result to commit.
  # The result JSON and markdown table are kept as the run's artifact, so the trend is readable.
  bench-vulnapp:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/burpsy-test-env
        with:
          cache-flavor: lint
          tools: "false"
      - name: Start OWASP VulnerableApp
        run: |
          docker run -d --name vulnapp -p 9090:9090 sasanlabs/owasp-vulnerableapp@sha256:01232bc8c9dd6d12cdc320212fa36e9f913860e83f1d766bd0bd034ceb385149
          for i in $(seq 60); do curl -fsS -o /dev/null http://127.0.0.1:9090/VulnerableApp/scanner && exit 0; sleep 2; done
          docker logs vulnapp | tail -50
          echo "::error::VulnerableApp did not come up"; exit 1
      - name: Build and start burpsy
        working-directory: burpsy-go
        run: |
          go build -o /tmp/burpsy ./cmd/burpsy
          nohup /tmp/burpsy -db /tmp/bsy.db -proxy 127.0.0.1:18080 -web 127.0.0.1:18081 -scope-include 127.0.0.1 >/tmp/burpsy-bench.log 2>&1 &
          for i in $(seq 30); do curl -fsS -o /dev/null http://127.0.0.1:18081/ && exit 0; sleep 1; done
          tail -50 /tmp/burpsy-bench.log; echo "::error::burpsy did not come up"; exit 1
      - name: Score VulnerableApp
        run: python3 scripts/bench/run_vulnapp.py --out /tmp/bench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulnapp-bench
          path: /tmp/bench
          if-no-files-found: warn
      - name: Compare with the tracked baseline
        run: |
          result=$(ls -t /tmp/bench/vulnapp-*.json | head -1)
          rc=0
          python3 scripts/bench/compare_baseline.py "$result" scripts/bench/baseline/vulnapp.json || rc=$?
          if [ "$rc" = 3 ]; then
            echo "::warning::no baseline in scripts/bench/baseline/vulnapp.json; commit the uploaded result there to start tracking regressions"
            exit 0
          fi
          exit "$rc"
      - name: burpsy log (on failure)
        if: failure()
        run: tail -100 /tmp/burpsy-bench.log || true


  # Reference-tool parity (bead j1mk.1): burpsy and each class's pinned reference tool are run on
  # the same targets and the findings diffed (scripts/bench/parity_run.py). The registered classes
  # grow as their beads land (j1mk.13, .14, .15, ...); with none registered the job passes with the
  # harness's note. A report, not a gate, like parity.py: reference-only rows are misses to file as
  # beads, and the run's parity.json/parity.md plus history.jsonl are the stored trend. capped-run
  # is deliberately not used here (its own header: each Actions job already has a runner to
  # itself); scripts/bench/nightly-parity.sh is the capped local/agent entry point.
  bench-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/burpsy-test-env
        with:
          cache-flavor: lint
          tools: "false"
      - name: Build burpsy and the demo target
        working-directory: burpsy-go
        run: |
          go build -o /tmp/burpsy ./cmd/burpsy
          go build -o /tmp/demo-target ./cmd/demo-target
      - name: Start the target and burpsy
        run: |
          nohup /tmp/demo-target -addr 127.0.0.1:19090 >/tmp/parity-target.log 2>&1 &
          nohup python3 scripts/bench/crawlfix.py -addr 127.0.0.1:19091 >/tmp/parity-crawlfix.log 2>&1 &
          nohup /tmp/burpsy -db /tmp/bsy-parity.db -proxy 127.0.0.1:18080 -web 127.0.0.1:18081 -scope-include 127.0.0.1 >/tmp/burpsy-parity.log 2>&1 &
          for i in $(seq 30); do
            curl -fsS -o /dev/null http://127.0.0.1:19090/ && curl -fsS -o /dev/null http://127.0.0.1:19091/ && curl -fsS -o /dev/null http://127.0.0.1:18081/ && exit 0
            sleep 1
          done
          tail -50 /tmp/parity-target.log /tmp/burpsy-parity.log
          echo "::error::target or burpsy did not come up"; exit 1
      - name: Run every registered parity class
        run: python3 scripts/bench/parity_run.py --all --out /tmp/parity --burpsy-web http://127.0.0.1:18081 --burpsy-proxy http://127.0.0.1:18080
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity
          path: /tmp/parity
          if-no-files-found: warn
      - name: burpsy log (on failure)
        if: failure()
        run: tail -100 /tmp/burpsy-parity.log /tmp/parity-target.log || true

  # One `go test -fuzz` process per target (go test takes one per run). 22 targets x 2 min plus a
  # compile each fits the timeout. A listed target missing from its package, or a target nobody
  # listed, fails the job (ci-fuzz.sh verify). The generated corpus ($GOCACHE/fuzz) is cached across
  # nights so each run continues from the last instead of from the seeds. A crasher is
  # written to internal/<pkg>/testdata/fuzz/<Target>/ and uploaded: commit it as the regression test.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/burpsy-test-env
        with:
          cache-flavor: lint
          tools: "false"
      - name: Every listed target exists
        run: scripts/ci-fuzz.sh verify
      - name: Locate the fuzz corpus cache
        id: fuzzcache
        run: echo "dir=$(cd burpsy-go && go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.fuzzcache.outputs.dir }}
          key: nightly-fuzz-corpus-${{ github.run_id }}
          restore-keys: nightly-fuzz-corpus-
      - name: Fuzz
        env:
          CI_FUZZ_TIME: 2m
        run: scripts/ci-fuzz.sh run
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashers
          path: burpsy-go/internal/*/testdata/fuzz/
          if-no-files-found: ignore

  # A red nightly is a defect on master to file (header). This job files it: one open issue labelled
  # nightly-failure collects every red night (a new comment per run) until someone closes it. Only
  # this job gets issues:write; the workflow default stays contents:read.
  report:
    needs: [e2e-go, race, bench-vulnapp, bench-parity, fuzz]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: File or update the nightly-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key' <<<"$RESULTS" | paste -sd, -)
          body="Nightly failed on ${SHA} — jobs: ${failed:-unknown}. Run: ${RUN_URL}"
          gh label create nightly-failure --color B60205 --description "A scheduled nightly run failed" 2>/dev/null || true
          open=$(gh issue list --label nightly-failure --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "Nightly failing on master" --label nightly-failure --body "$body"
          fi
