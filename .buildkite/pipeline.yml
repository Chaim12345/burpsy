# Buildkite pipeline for burpsy, on Buildkite hosted agents — ALONGSIDE the GitHub Actions gate
# (.github/workflows/go.yml), not instead of it, and not a required check. See .buildkite/README.md.
#
# This is the bootstrap the pipeline's settings upload. Its one step runs on the hosted queue's
# default image (which has docker), makes sure the burpsy agent image for this commit's Dockerfile
# and install script exists in the cluster's own registry, and then uploads the real steps
# (.buildkite/steps.yml) to run in that image.

agents:
  queue: burpsy

steps:
  - label: ":docker: agent image"
    key: image
    command: .buildkite/image.sh
    timeout_in_minutes: 30
