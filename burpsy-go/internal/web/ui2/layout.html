<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<style>
:root { color-scheme: light dark; --bg:#fff; --fg:#111; --muted:#666; --line:#ddd; --accent:#06c; --sel:#dce9ff; }
@media (prefers-color-scheme: dark) { :root { --bg:#16181d; --fg:#e6e6e6; --muted:#9aa; --line:#333; --accent:#7ab; --sel:#274; } }
* { box-sizing: border-box; }
body { margin:0; font:13px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--fg); }
header { display:flex; gap:14px; align-items:center; padding:8px 14px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); }
header .brand { font-weight:700; }
header nav a { color:var(--fg); text-decoration:none; padding:4px 10px; border-radius:6px; }
header nav a.active { background:var(--sel); }
header form { display:flex; gap:6px; margin-left:auto; }
input[type=search], input[type=text] { padding:4px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
button, .btn { padding:4px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); cursor:pointer; text-decoration:none; display:inline-block; }
main { display:flex; height:calc(100vh - 45px); }
#list { width:60%; overflow-y:auto; border-right:1px solid var(--line); }
#detail { width:40%; overflow-y:auto; padding:10px 14px; }
table { border-collapse:collapse; width:100%; }
th, td { text-align:left; padding:3px 8px; border-bottom:1px solid var(--line); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:340px; }
th { position:sticky; top:0; background:var(--bg); color:var(--muted); font-weight:600; }
tbody tr { cursor:pointer; }
tbody tr:hover { background:var(--sel); }
tbody tr.selected { background:var(--sel); }
.sev { font-weight:700; text-transform:uppercase; font-size:11px; }
.sev-high, .sev-critical { color:#c00; }
.sev-medium { color:#a60; }
.sev-low { color:#06c; }
.sev-informational, .sev-info { color:var(--muted); }
.meta { color:var(--muted); font-size:12px; padding:6px 14px; }
pre { white-space:pre-wrap; word-break:break-all; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:8px; font:12px/1.4 ui-monospace, monospace; max-height:45vh; overflow:auto; }
h3 { margin:10px 0 4px; }
.badge { background:var(--sel); border-radius:10px; padding:1px 8px; font-size:11px; }
.fp { color:var(--muted); text-decoration:line-through; }
</style>
</head>
<body>
<header>
  <span class="brand">burpsy <span class="badge">ui2</span></span>
  <nav>
    <a href="/ui2/history" class="{{if eq .View "history"}}active{{end}}">History</a>
    <a href="/ui2/issues" class="{{if eq .View "issues"}}active{{end}}">Issues</a>
    <a href="/">old UI</a>
  </nav>
  {{if eq .View "history"}}
  <form hx-get="/ui2/history" hx-target="#rows" hx-swap="outerHTML" hx-trigger="submit, keyup changed delay:400ms from:#q" hx-push-url="true">
    <input type="search" id="q" name="q" aria-label="Filter query (burpsy DSL, e.g. host~example.com)" placeholder="filter: host~example.com path~/api" autocomplete="off">
    <input type="search" name="search" aria-label="Search rows" placeholder="search…" autocomplete="off"
      hx-get="/ui2/history" hx-target="#rows" hx-swap="outerHTML" hx-trigger="keyup changed delay:400ms" hx-include="#q" hx-push-url="true">
    <noscript><button>Filter</button></noscript>
  </form>
  {{end}}
</header>
<main>
  <div id="list" role="region" aria-label="Rows" hx-ext="sse" sse-connect="/api/events" sse-swap="history-ping">
    {{.Body}}
  </div>
  <div id="detail" role="region" aria-label="Selected item detail" aria-live="polite"><p class="meta">Select a row to see its request and response.</p></div>
</main>
<script src="/ui2/htmx.min.js"></script>
<script src="/ui2/sse.min.js"></script>
<script src="/ui2/app.js"></script>
</body>
</html>
