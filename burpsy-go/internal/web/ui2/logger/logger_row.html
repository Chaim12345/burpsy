{{define "logger_row"}}<tr class="lg-row{{if .Selected}} selected{{end}}" data-id="{{.ID}}" hx-get="/ui2/logger/entry/{{.ID}}" hx-target="#logger-detail" hx-swap="innerHTML" hx-push-url="false"><td>{{if .Highlight}}<span class="hl-sw hl-sw-{{.Highlight}}" title="{{.Highlight}}"></span>{{else}}<span class="meta">—</span>{{end}}</td><td>{{.Tool}}</td><td>{{.Method}}</td><td>{{.Host}}:{{.Port}}</td><td title="{{.Path}}">{{.Path}}</td>
<td>{{if .Status}}{{.Status}}{{else}}—{{end}}</td><td>{{if .ResponseLen}}{{.ResponseLen}}{{else}}—{{end}}</td><td>{{.DurationMs}}</td><td title="{{.Comment}}">{{if .Comment}}{{.Comment}}{{else}}—{{end}}</td><td>{{.Age}}</td></tr>{{end}}
