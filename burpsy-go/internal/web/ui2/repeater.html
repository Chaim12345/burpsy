<div id="rows">
<p class="meta">More Repeater tools: <a href="/ui2/repeater/ws">WebSocket</a> · <a href="/ui2/repeater/h2">HTTP/2 header list</a> · <a href="/ui2/repeater/graphql">GraphQL</a></p>
{{/* A stand-alone draft (the Site map's "Send to Repeater"): Send opens it as a new Repeater tab and sends it; "Open as new tab" opens it without sending. */}}
<form method="post" action="/ui2/repeater/send" hx-post="/ui2/repeater/send" hx-target="#rows" hx-swap="outerHTML">
  <input type="text" name="target" aria-label="Target host[:port] (defaults to the request's Host header)" placeholder="target host[:port] — optional" value="{{.target}}" style="width:100%; margin-bottom:6px">
  <textarea name="raw" rows="14" style="width:100%; font-family:ui-monospace,monospace" aria-label="Request to send">{{.draft}}</textarea>
  <div style="margin:6px 0;">
    <button type="submit">Send</button>
    <button type="submit" formaction="/ui2/repeater/tabs/new" hx-post="/ui2/repeater/tabs/new">Open as new tab</button>
  </div>
</form>
{{if .error}}<p class="meta" role="alert" style="color:#c00">{{.error}}</p>{{end}}
</div>
