<div id="rows">
<p class="meta">{{len .items}} items · {{len .collections}} collections</p>
<table>
<thead><tr><th scope="col">ID</th><th scope="col">Title</th><th scope="col">Status</th><th scope="col">Note</th><th scope="col">Exchange</th></tr></thead>
<tbody>
{{range .items}}
<tr><td>{{.id}}</td><td>{{.title}}</td><td>{{.status}}</td><td class="meta">{{.note}}</td>
<td>{{if .exchange}}#{{.exchange}}{{else}}—{{end}}</td></tr>
{{else}}<tr><td colspan="5" class="meta">Organizer is empty.</td></tr>{{end}}
</tbody>
</table>
</div>
