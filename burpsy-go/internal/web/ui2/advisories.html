<div id="rows">
<p class="meta">{{.count}} definitions · {{range $sev, $n := .severity_counts}}<span class="sev sev-{{$sev | lower}}">{{$sev}}</span> {{$n}} · {{end}}</p>
<table>
<thead><tr><th scope="col">Type</th><th scope="col">Name</th><th scope="col">Severity</th></tr></thead>
<tbody>
{{range .advisories}}
<tr hx-get="/api/advisories/{{.type_index}}" hx-target="#detail" hx-swap="innerHTML" hx-trigger="click" hx-headers='{"Accept":"application/json"}'>
<td>{{.type_index}}</td><td>{{.name}}</td><td class="sev sev-{{.severity | lower}}">{{.severity}}</td></tr>
{{else}}<tr><td colspan="3" class="meta">Catalogue not loaded.</td></tr>{{end}}
</tbody>
</table>
</div>
