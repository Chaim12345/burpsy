[workspace]
resolver = "3"
members = ["crates/core", "crates/http2", "crates/proxy", "crates/sender", "crates/intruder", "crates/web", "crates/cli", "crates/bcheck", "crates/scanner", "crates/tools", "crates/query", "crates/session", "crates/sequencer"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
tokio      = { version = "1", features = ["full"] }
bytes      = "1"
anyhow     = "1"
thiserror  = "2"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tracing    = "0.1"
tracing-subscriber = "0.3"
parking_lot = "0.12"
